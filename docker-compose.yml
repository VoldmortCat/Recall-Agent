# Recall — AI 智能错题本 · 一键部署
# 用法：docker compose up -d --build   →  访问 http://服务器IP:3000
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      # SQLite 数据文件持久化到 volume（挂载 /app/data/db）
      DATABASE_URL: file:/app/data/db/dev.db
      OCR_SERVICE_URL: http://ocr:5000/ocr
      CHROMA_SERVICE_URL: http://chroma:5001
      PDF_SERVICE_URL: http://pdf:5002/generate
    volumes:
      - db_data:/app/data/db          # SQLite 数据库
      - uploads_data:/app/server/uploads   # 错题图片
      - server_data:/app/server/data       # 运行时设置 settings.json
    depends_on:
      - ocr
      - chroma
      - pdf
    restart: unless-stopped

  ocr:
    build: ./ai/ocr
    restart: unless-stopped

  chroma:
    build: ./ai/chroma_db
    environment:
      # 向量库持久化目录（源码默认 data/chroma，容器内改为 /app/data）
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - chroma_data:/app/data
    restart: unless-stopped

  pdf:
    build: ./ai/pdf
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
  server_data:
  chroma_data: