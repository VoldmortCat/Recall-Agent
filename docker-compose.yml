version: "3.8"

services:
  # ------ 后端服务 ------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://recall:recall@postgres:5432/recall
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=recall-jwt-secret-dev
      - OCR_SERVICE_URL=http://ocr:5000/ocr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/.env:/app/.env
    restart: unless-stopped

  # ------ 前端服务 ------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped

  # ------ OCR 识别服务 ------
  ocr:
    build:
      context: ./ai/ocr
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - OCR_PORT=5000
    restart: unless-stopped

  # ------ PostgreSQL ------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------ Redis ------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: